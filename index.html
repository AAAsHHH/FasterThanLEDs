<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARAsHHH</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    /* identical to your ESP CSS – copy it all */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }
    .container { width: 100%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    h1 { text-align: center; font-weight: 300; font-size: 2.2rem; letter-spacing: 2px; background: linear-gradient(90deg, #ff00cc, #3333ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
    .card { background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    #stripPreview { width: 100%; height: 45px; background: rgba(0,0,0,0.4); border-radius: 12px; display: block; margin-bottom: 10px; }
    .color-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #colorPicker { -webkit-appearance: none; width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); background: transparent; cursor: pointer; transition: transform 0.2s; }
    #colorPicker:hover { transform: scale(1.05); }
    #colorPicker::-webkit-color-swatch-wrapper { padding: 0; }
    #colorPicker::-webkit-color-swatch { border: none; border-radius: 50%; }
    .effect-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
    button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ccc; padding: 12px 8px; border-radius: 14px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(8px); }
    button.active { background: linear-gradient(135deg, #ff00cc, #3333ff); border-color: transparent; color: white; box-shadow: 0 4px 15px rgba(255,0,204,0.4); }
    .slider-group { display: flex; flex-direction: column; gap: 4px; margin: 5px 0; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; color: #aaa; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 8px; background: rgba(255,255,255,0.15); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: white; box-shadow: 0 0 15px #ff00cc; cursor: pointer; }
    .value-badge { background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }
    .rgb-sliders { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .rgb-sliders input { flex: 1; }
    .rgb-label { width: 20px; font-size: 0.8rem; color: #aaa; text-align: center; }
    footer { text-align: center; font-size: 0.7rem; color: #555; margin-top: 5px; }
    .ip-box { background: rgba(255,255,255,0.06); padding: 10px; border-radius: 12px; }
    .ip-box label { font-size: 0.8rem; color: #aaa; }
    .ip-box input { width: 100%; padding: 8px; margin-top: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; }
    .install-btn { display: none; }  /* We'll use the native prompt, not a button */
  </style>
</head>
<body>
  <div class="container">
    <h1>AAAsHHH</h1>

    <!-- IP configuration -->
    <div class="ip-box">
      <label>ESP Controller IP</label>
      <input type="text" id="ipInput" value="192.168.4.1" placeholder="ESP IP">
    </div>

    <div class="card" style="padding:10px;">
      <canvas id="stripPreview" width="400" height="45"></canvas>
    </div>

    <div class="card color-section">
      <label style="font-size:0.9rem; color:#aaa;">Pick a Color</label>
      <input type="color" id="colorPicker" value="#ff0000" onchange="setColorFromPicker(this.value)">
      <div class="rgb-sliders">
        <span class="rgb-label">R</span><input type="range" min="0" max="255" value="255" id="rSlider" oninput="setColorFromSliders()">
        <span class="rgb-label">G</span><input type="range" min="0" max="255" value="0" id="gSlider" oninput="setColorFromSliders()">
        <span class="rgb-label">B</span><input type="range" min="0" max="255" value="0" id="bSlider" oninput="setColorFromSliders()">
      </div>
    </div>

    <div class="card">
      <div style="font-size:0.9rem; color:#aaa; margin-bottom:8px;">Effect</div>
      <div class="effect-grid">
        <button onclick="setEffect('static')" id="btn-static">Static</button>
        <button onclick="setEffect('rainbow')" id="btn-rainbow">Rainbow</button>
        <button onclick="setEffect('chase')" id="btn-chase">Chase</button>
        <button onclick="setEffect('breathe')" id="btn-breathe">Breathe</button>
        <button onclick="setEffect('palette')" id="btn-palette">Palette</button>
      </div>
    </div>

    <div class="card">
      <div class="slider-group">
        <div class="slider-header"><span>LED Count</span><span class="value-badge" id="ledCountVal">60</span></div>
        <input type="range" min="1" max="300" value="60" id="ledCountSlider" oninput="setLedCountDebounced(this.value)">
      </div>
      <div class="slider-group" style="margin-top:12px;">
        <div class="slider-header"><span>Brightness</span><span class="value-badge" id="brightVal">100</span></div>
        <input type="range" min="0" max="255" value="100" id="brightSlider" oninput="setBrightnessDebounced(this.value)">
      </div>
      <div class="slider-group" style="margin-top:12px;">
        <div class="slider-header"><span>Speed</span><span class="value-badge" id="speedVal">50</span></div>
        <input type="range" min="0" max="100" value="50" id="speedSlider" oninput="setSpeedDebounced(this.value)">
      </div>
    </div>
    <footer>AAAsHHH WS28XX Controller</footer>
  </div>

  <script>
    // ----- IP management (saved in localStorage) -----
    let controllerIP = localStorage.getItem('ledIP') || '192.168.4.1';
    document.getElementById('ipInput').value = controllerIP;
    document.getElementById('ipInput').addEventListener('change', function() {
      controllerIP = this.value.trim() || '192.168.4.1';
      localStorage.setItem('ledIP', controllerIP);
    });

    // ----- All your existing JavaScript, but prefix fetch URLs with `http://${controllerIP}` -----
    let ledCount=60,currentColor='#ff0000',currentEffect='static',brightness=100,speed=50;
    let rainbowHue=0,chasePos=0,breathePhase=0,paletteIndex=0,lastTimestamp=0,accumulator=0;
    const canvas=document.getElementById('stripPreview'),ctx=canvas.getContext('2d');
    function debounce(fn,delay){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),delay);};}
    function mapValue(x,in_min,in_max,out_min,out_max){return (x-in_min)*(out_max-out_min)/(in_max-in_min)+out_min;}
    function hexToRgb(hex){return {r:parseInt(hex.substr(1,2),16),g:parseInt(hex.substr(3,2),16),b:parseInt(hex.substr(5,2),16)};}
    function rgbToHex(r,g,b){return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
    function drawPreview(){
      const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const spacing=w/ledCount,radius=Math.min(spacing*0.45,10);
      for(let i=0;i<ledCount;i++){
        let x=i*spacing+spacing/2,y=h/2,color;
        switch(currentEffect){
          case 'static':color=currentColor;break;
          case 'rainbow':color=`hsl(${Math.floor(((rainbowHue+i*3)%256)*360/255)},100%,60%)`;break;
          case 'chase':color=(i===chasePos||i===(chasePos+1)%ledCount||i===(chasePos+2)%ledCount)?currentColor:'#111';break;
          case 'breathe':{let v=(Math.sin(breathePhase)+1)/2,rgb=hexToRgb(currentColor);color=`rgb(${Math.floor(rgb.r*v)},${Math.floor(rgb.g*v)},${Math.floor(rgb.b*v)})`;break;}
          case 'palette':color=`hsl(${Math.floor(((paletteIndex+i*5)%256)*360/255)},100%,60%)`;break;
        }
        ctx.beginPath();ctx.arc(x,y,radius,0,2*Math.PI);ctx.fillStyle=color;ctx.shadowBlur=6;ctx.shadowColor=color;ctx.fill();ctx.shadowBlur=0;
      }
    }
    function advanceOneStep(){
      if(currentEffect==='rainbow')rainbowHue=(rainbowHue+1)%256;
      else if(currentEffect==='chase')chasePos=(chasePos+1)%ledCount;
      else if(currentEffect==='breathe'){breathePhase+=0.1;if(breathePhase>2*Math.PI)breathePhase=0;}
      else if(currentEffect==='palette')paletteIndex=(paletteIndex+1)%256;
    }
    function animate(ts){
      if(currentEffect==='static'){drawPreview();requestAnimationFrame(animate);return;}
      if(!lastTimestamp)lastTimestamp=ts;let delta=ts-lastTimestamp;lastTimestamp=ts;if(delta>500)delta=500;
      const stepDuration=mapValue(speed,0,100,80,5);accumulator+=delta;
      while(accumulator>=stepDuration){advanceOneStep();accumulator-=stepDuration;}
      drawPreview();requestAnimationFrame(animate);
    }
    function updateColorUI(hex){
      currentColor=hex;document.getElementById('colorPicker').value=hex;
      let rgb=hexToRgb(hex);document.getElementById('rSlider').value=rgb.r;document.getElementById('gSlider').value=rgb.g;document.getElementById('bSlider').value=rgb.b;
    }
    function setColorFromPicker(hex){updateColorUI(hex);setColorDebounced(hex);if(currentEffect==='static'||currentEffect==='breathe')drawPreview();}
    function setColorFromSliders(){
      let r=+document.getElementById('rSlider').value,g=+document.getElementById('gSlider').value,b=+document.getElementById('bSlider').value;
      let hex=rgbToHex(r,g,b);updateColorUI(hex);setColorDebounced(hex);if(currentEffect==='static'||currentEffect==='breathe')drawPreview();
    }
    const setColorDebounced=debounce(h=>{let rgb=hexToRgb(h);fetch(`http://${controllerIP}/setcolor?r=${rgb.r}&g=${rgb.g}&b=${rgb.b}`);},100);
    const setBrightnessDebounced=debounce(v=>{brightness=+v;document.getElementById('brightVal').innerText=v;fetch(`http://${controllerIP}/setbrightness?val=${v}`);},100);
    const setSpeedDebounced=debounce(v=>{speed=+v;document.getElementById('speedVal').innerText=v;fetch(`http://${controllerIP}/setspeed?val=${v}`);},100);
    const setLedCountDebounced=debounce(v=>{ledCount=+v;document.getElementById('ledCountVal').innerText=v;fetch(`http://${controllerIP}/setledcount?count=${ledCount}`);if(chasePos>=ledCount)chasePos=0;drawPreview();},100);
    function setEffect(effect){
      currentEffect=effect;fetch(`http://${controllerIP}/seteffect?effect=${effect}`);
      document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+effect).classList.add('active');
      rainbowHue=chasePos=paletteIndex=0;breathePhase=0;accumulator=0;
    }
    async function loadState(){
      try{
        let resp=await fetch(`http://${controllerIP}/status`);let data=await resp.json();
        ledCount=data.ledcount;document.getElementById('ledCountSlider').value=ledCount;document.getElementById('ledCountVal').innerText=ledCount;
        brightness=data.brightness;document.getElementById('brightSlider').value=brightness;document.getElementById('brightVal').innerText=brightness;
        speed=data.speed;document.getElementById('speedSlider').value=speed;document.getElementById('speedVal').innerText=speed;
        currentColor=data.color;updateColorUI(currentColor);currentEffect=data.effect;setEffect(data.effect);
      }catch(e){}
    }

    // Register service worker (for offline caching)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }

    window.onload=()=>{loadState();requestAnimationFrame(animate);};
  </script>
</body>
</html>
